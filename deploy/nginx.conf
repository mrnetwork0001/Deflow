# nginx site for usedeflow.xyz
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/deflow
#   sudo ln -s /etc/nginx/sites-available/deflow /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d usedeflow.xyz -d www.usedeflow.xyz
#
# Everything is served from one origin: the FastAPI process serves both the
# static dashboard and the API. That removes CORS from the picture entirely and
# leaves one moving part instead of two.

upstream deflow {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name usedeflow.xyz www.usedeflow.xyz;
    # certbot rewrites this block to redirect to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usedeflow.xyz www.usedeflow.xyz;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/usedeflow.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/usedeflow.xyz/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    # Server-sent events. Buffering here would hold the decision stream in
    # nginx and deliver it in bursts, so the dashboard would look frozen
    # between cycles; the long read timeout keeps the connection open across
    # the quiet gaps between trades.
    location /api/stream {
        proxy_pass http://deflow;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://deflow;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}
