# Interim nginx site: serve Deflow over plain HTTP on the server's IP.
#
# Used when DNS is not ready yet — a domain and a certificate are needed for a
# presentable URL, not for the desk to trade. Deploying IP-first means the
# agent can be live at the market open and the domain can land afterwards
# without touching the trading process.
#
#   sudo cp deploy/nginx-ip.conf /etc/nginx/sites-available/deflow
#   sudo ln -sf /etc/nginx/sites-available/deflow /etc/nginx/sites-enabled/deflow
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Swap to deploy/nginx.conf and run certbot once DNS resolves.

upstream deflow {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    # Keep this reachable so certbot can complete the HTTP-01 challenge later
    # without any further nginx surgery.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # SSE must not be buffered: the decision stream would arrive in bursts and
    # the dashboard would look frozen between cycles.
    location /api/stream {
        proxy_pass http://deflow;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://deflow;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}
